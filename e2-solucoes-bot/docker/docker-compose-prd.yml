# ============================================================================
# E2 Soluções Bot - Production Docker Compose
# Servidor: climacocal.com.br | Cloudflare Tunnel → Traefik → containers
# ============================================================================
#
# PRÉ-REQUISITOS antes de subir:
#   1. Confirmar nome da rede Traefik do servidor:
#      docker network ls | grep -iE "traefik|proxy"
#      Definir TRAEFIK_NETWORK no .env com esse nome.
#
#   2. Confirmar nome do certresolver do Traefik do servidor:
#      docker inspect <traefik-container> | grep certresolver
#      Definir TRAEFIK_CERTRESOLVER no .env com esse nome.
#
#   3. Preencher TODOS os valores no .env (ver PRODUCTION_DEPLOYMENT_GUIDE.md)
#
# DEPLOY:
#   docker compose -f docker/docker-compose-prd.yml up -d
#   docker compose -f docker/docker-compose-prd.yml ps
#
# COM MONITORING:
#   docker compose -f docker/docker-compose-prd.yml --profile monitoring up -d
#
# CONTAINERS GERADOS:
#   e2bot-postgres-prd    → PostgreSQL (e2bot_prod + evolution_db via init.sql)
#   e2bot-redis-prd       → Redis cache/queue
#   e2bot-n8n-prd         → n8n main (webhooks + UI)
#   e2bot-n8n-worker-prd  → n8n worker (execuções — requer rede proxy para internet)
#   e2bot-evolution-prd   → Evolution API WhatsApp (porta local 8082)
#   e2bot-templates-prd   → nginx servindo email-templates/ para WF07
#
# DOCS: docs/deployment/production/PRODUCTION_DEPLOYMENT_GUIDE.md
# ============================================================================

services:

  # ==========================================================================
  # DATABASE - PostgreSQL 15
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: e2bot-postgres-prd
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-1000}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=pt_BR.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres:/backups
    networks:
      - e2bot-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ==========================================================================
  # CACHE & QUEUE - Redis 7
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: e2bot-redis-prd
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - e2bot-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ==========================================================================
  # WORKFLOW AUTOMATION - n8n 2.14.2
  # ==========================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: e2bot-n8n-prd
    restart: unless-stopped
    environment:
      # Auth
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # Host
      - N8N_HOST=${N8N_SUBDOMAIN}.${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_SUBDOMAIN}.${DOMAIN}/
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_TEMPLATES_ENABLED=false
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # Queue mode (requer n8n-worker abaixo)
      - EXECUTIONS_MODE=${EXECUTIONS_MODE:-queue}
      - EXECUTIONS_TIMEOUT=${EXECUTIONS_TIMEOUT:-300}
      - EXECUTIONS_TIMEOUT_MAX=${EXECUTIONS_TIMEOUT_MAX:-600}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      # Workflow env vars
      - EVOLUTION_API_URL=https://${EVOLUTION_SUBDOMAIN}.${DOMAIN}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./email-templates:/email-templates:ro
    networks:
      - e2bot-frontend
      - e2bot-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.e2bot-n8n.rule=Host(`${N8N_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.e2bot-n8n.entrypoints=websecure"
      - "traefik.http.routers.e2bot-n8n.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.e2bot-n8n.middlewares=e2bot-security-headers,e2bot-rate-limit"
      - "traefik.http.services.e2bot-n8n.loadbalancer.server.port=5678"
      # Middlewares (definidos aqui para evitar conflito com middlewares do climacocal)
      - "traefik.http.middlewares.e2bot-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.e2bot-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.e2bot-security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.e2bot-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.e2bot-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.e2bot-rate-limit.ratelimit.average=${TRAEFIK_RATE_LIMIT_AVERAGE:-100}"
      - "traefik.http.middlewares.e2bot-rate-limit.ratelimit.burst=${TRAEFIK_RATE_LIMIT_BURST:-200}"
      - "traefik.http.middlewares.e2bot-rate-limit.ratelimit.period=1s"

  # ==========================================================================
  # N8N WORKER - Processa execuções em queue mode
  # (Necessário quando EXECUTIONS_MODE=queue)
  # ==========================================================================
  n8n-worker:
    image: n8nio/n8n:latest
    container_name: e2bot-n8n-worker-prd
    restart: unless-stopped
    command: worker
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Workflow env vars (mesmos do n8n principal)
      - EVOLUTION_API_URL=https://${EVOLUTION_SUBDOMAIN}.${DOMAIN}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - e2bot-frontend   # necessário para acesso à internet (Google Calendar, etc.)
      - e2bot-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

  # ==========================================================================
  # WHATSAPP INTEGRATION - Evolution API (evoapicloud)
  # evoapicloud/evolution-api lê env vars diretamente — sem workaround necessário
  # ==========================================================================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: e2bot-evolution-prd
    restart: unless-stopped
    environment:
      - SERVER_URL=https://${EVOLUTION_SUBDOMAIN}.${DOMAIN}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_DB}?schema=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBHOOK_GLOBAL_URL=https://${N8N_SUBDOMAIN}.${DOMAIN}/webhook/whatsapp-evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - CONFIG_SESSION_PHONE_CLIENT=${CONFIG_SESSION_PHONE_CLIENT:-E2 Bot Production}
      - CONFIG_SESSION_PHONE_NAME=${CONFIG_SESSION_PHONE_NAME:-E2 Soluções}
      - QRCODE_LIMIT=${QRCODE_LIMIT:-30}
      - TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      - LOG_COLOR=false
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - e2bot-frontend
      - e2bot-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ | grep -q 'Evolution API' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.e2bot-evolution.rule=Host(`${EVOLUTION_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.e2bot-evolution.entrypoints=websecure"
      - "traefik.http.routers.e2bot-evolution.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.e2bot-evolution.middlewares=e2bot-security-headers,e2bot-rate-limit"
      - "traefik.http.services.e2bot-evolution.loadbalancer.server.port=8080"

  # ==========================================================================
  # EMAIL TEMPLATES - nginx serving HTML templates for WF07
  # Acessível internamente como http://e2bot-templates-prd/
  # ==========================================================================
  templates:
    image: nginx:alpine
    container_name: e2bot-templates-prd
    restart: unless-stopped
    volumes:
      - ../email-templates:/usr/share/nginx/html:ro
    networks:
      - e2bot-backend

  # ==========================================================================
  # MONITORING - Prometheus (opcional, profile: monitoring)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: e2bot-prometheus-prd
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_STORAGE_RETENTION_SIZE:-10GB}'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - e2bot-backend
      - e2bot-frontend
    profiles:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.e2bot-prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.e2bot-prometheus.entrypoints=websecure"
      - "traefik.http.routers.e2bot-prometheus.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.e2bot-prometheus.middlewares=e2bot-security-headers"
      - "traefik.http.services.e2bot-prometheus.loadbalancer.server.port=9090"

  # ==========================================================================
  # MONITORING - Grafana (opcional, profile: monitoring)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: e2bot-grafana-prd
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - e2bot-backend
      - e2bot-frontend
    profiles:
      - monitoring
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.e2bot-grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.e2bot-grafana.entrypoints=websecure"
      - "traefik.http.routers.e2bot-grafana.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.e2bot-grafana.middlewares=e2bot-security-headers"
      - "traefik.http.services.e2bot-grafana.loadbalancer.server.port=3000"

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  # Rede do Traefik existente no servidor climacocal
  # IMPORTANTE: confirmar o nome correto com:
  #   docker network ls | grep -iE "traefik|proxy"
  e2bot-frontend:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

  # Rede interna (postgres, redis) - sem acesso externo
  e2bot-backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
    labels:
      - "com.docker.volume.description=E2Bot PostgreSQL Data"
      - "com.docker.volume.backup=true"

  n8n_data:
    driver: local
    labels:
      - "com.docker.volume.description=E2Bot n8n Workflow Data"
      - "com.docker.volume.backup=true"

  evolution_data:
    driver: local
    labels:
      - "com.docker.volume.description=E2Bot Evolution API Instances"
      - "com.docker.volume.backup=true"

  redis_data:
    driver: local

  prometheus_data:
    driver: local

  grafana_data:
    driver: local
